services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?задайте AUTH_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: "false"   # локально — без TLS
      # Трейси/логи/метрики в Elastic APM (або OTel Collector). Порожньо — вимкнено.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
