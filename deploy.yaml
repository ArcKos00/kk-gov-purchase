# =============================================================================
# Purchase (order-tracking) — Kubernetes deployment
# -----------------------------------------------------------------------------
# Підстановка змінних — та сама, що й в інших сервісах: Jenkins підставляє ${NAMESPACE},
# ${REPOSITORY} і ${IMAGE_TAG}; застосувати, наприклад:
#     envsubst < deploy.yaml | kubectl apply -f -
# Ім'я сервісу (purchase) і хост (purchase.gov.kub.k2.lan) задані тут явно.
#
# Оновлення без простою працює ЛИШЕ через RollingUpdate Deployment-а (maxSurge 1, maxUnavailable 0).
# Тобто кожен деплой має міняти pod template:
#   * унікальний ${IMAGE_TAG} на кожну збірку (imagePullPolicy IfNotPresent + той самий тег =
#     apply нічого не змінює, а старий образ на вузлі лишається старим);
#   * якщо тег той самий — `kubectl -n ${NAMESPACE} rollout restart deploy/purchase`.
#
# Один образ (Dockerfile у корені репозиторію) і один контейнер: NestJS на порту 3000 віддає /api/* і роздає
# зібраний фронт (apps/web/dist). Схему БД застосунок накочує сам на старті (TypeORM migrationsRun).
#
# Секрет purchase-secret створюється руками, у yaml його немає. БД — окремий інстанс на local.storage:
#     kubectl -n ${NAMESPACE} create secret generic purchase-secret \
#       --from-literal=DATABASE_URL='postgres://purchase:<пароль>@local.storage:5437/purchase' \
#       --from-literal=KEYCLOAK_CLIENT_SECRET='<secret клієнта purchase у Keycloak>' \
#       --from-literal=SESSION_SECRET="$(openssl rand -hex 32)"
#
# Вхід — лише через сторінку Keycloak (Code + PKCE S256). У realm потрібен клієнт (KEYCLOAK_CLIENT_ID нижче): confidential
# (Client authentication ON), Standard flow, PKCE S256, Direct Access Grants OFF (форми з паролем немає);
# Valid redirect URI https://purchase.gov.kub.k2.lan/auth/callback, post-logout https://purchase.gov.kub.k2.lan/.
# Журнал дій бачать лише користувачі з роллю realm gov-purchase-admin (Users → <користувач> → Role mapping;
# назви — ADMIN_ROLE). Роль читається при вході: після призначення треба вийти й увійти знову.
# SESSION_SECRET має бути сталим між викатками: сесії лежать у базі (таблиця sessions), і з новим секретом
# кука sid перестане підписуватись — усіх викине на логін.
#
# Журнал дій (хто що змінив/видалив/куди клікнув) — таблиця audit_log у тій самій БД, сторінка «Журнал».
# Записи лише додаються (тригер забороняє UPDATE/DELETE). Кліки ростуть швидко; чистка старих — свідомо,
# власником таблиці, з вимкненим тригером audit_log_append_only. Журнал попередньої версії (вхід
# admin:admin), якщо її викатували, збережено в audit_log_v1.
#
# Логи — JSON у stdout (з trace_id/span_id і користувачем); трейси й метрики — OTLP в Elastic APM
# (apm-server.infrastructure, без токена — як у решти сервісів кластера).
#
# Вкладені файли (скани договорів/накладних) лежать на PVC purchase-uploads-lh (Longhorn, ReadWriteMany,
# 2 репліки на awsbackup + gpu). HA v2: дві репліки на різних вузлах — застосунок переживає втрату вузла.
# Спільне для подів — у базі (сесії, LISTEN/NOTIFY), файли — на RWX-томі (імена — випадкові UUID).
# Дані зі старого local-path PVC purchase-uploads переносить скрипт ДО викатки (114-pvc-migrate.sh);
# старий PVC видаляється руками.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: purchase-config
  namespace: ${NAMESPACE}
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Вкладені файли — на PVC (див. volumes нижче).
  UPLOADS_DIR: "/app/data/uploads"
  # Максимальний розмір одного файлу, МБ.
  MAX_UPLOAD_MB: "50"
  LOG_LEVEL: "info"
  # Keycloak (як у litopys). Issuer — рівно той рядок, що стоїть в `iss` токенів.
  KEYCLOAK_ISSUER: "https://auth.infrastructure.kub.k2.lan/realms/k2"   # TODO: звірити з litopys
  KEYCLOAK_CLIENT_ID: "gov_purchase"                                        # TODO: id клієнта в Keycloak
  # Куди браузер повертається після логіну (redirect URI = PUBLIC_URL/auth/callback); https → secure-кука.
  PUBLIC_URL: "https://purchase.gov.kub.k2.lan"
  # Скільки годин живе один вхід (не подовжується).
  SESSION_MAX_HOURS: "12"
  AUTH_DISABLED: "false"
  # Ролі адміністратора (журнал дій), через кому. Лише власна роль застосунку — не спільна «гола» admin realm-у.
  ADMIN_ROLE: "gov-purchase-admin"
  # Перегляд, пошук і фільтри без входу; зміни — лише після входу. "false" — усе лише після входу.
  ANONYMOUS_READ: "true"
  # OpenTelemetry → Elastic APM (OTLP/HTTP): трейси, метрики, логи.
  OTEL_SERVICE_NAME: "purchase"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://apm-server.infrastructure.svc.cluster.local:8200"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_TIMEOUT: "10000"
  OTEL_RESOURCE_ATTRIBUTES: "group=gov"
  # Усі заголовки HTTP-запиту/відповіді — в атрибути спанів (cookie/authorization маскуються).
  OTEL_CAPTURE_HEADERS: "true"
  # Тіла POST/PUT/DELETE (JSON) у трейсах — невдалий запис можна повторити з трейсу (тіло входу /auth/* — ніколи).
  OTEL_CAPTURE_BODY: "true"
  # Середовище в APM
  ELASTIC_APM_ENVIRONMENT: "${NAMESPACE}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: purchase-uploads-lh
  namespace: ${NAMESPACE}
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  labels:
    app: purchase
spec:
  # Дві репліки на різних вузлах (topologySpreadConstraints нижче): падіння пода чи вузла не зупиняє сервіс.
  # Міграції TypeORM (migrationsRun) — на старті кожного пода; RollingUpdate піднімає поди по одному.
  replicas: 2
  revisionHistoryLimit: 1
  # Скільки новий под має бути Ready, перш ніж старий отримає SIGTERM.
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  # RollingUpdate без простою: новий под піднімається поруч (maxSurge 1), старий живе, доки новий
  # не стане ready (maxUnavailable 0). Том — ReadWriteMany, тож новий под може стати на будь-який вузол.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: purchase
  template:
    metadata:
      labels:
        app: purchase
    spec:
      terminationGracePeriodSeconds: 30
      # HA v2: репліки — на різних вузлах. DoNotSchedule свідомо (ScheduleAnyway якось поклав обидві на gpu);
      # pod-template-hash — рахується лише поточний ReplicaSet, тож RollingUpdate (maxSurge 1) не блокується.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: purchase
      # gpu-вузол (localnvidiamachine) — другий вузол із Longhorn; з вузла, що впав, — геть за 30 с, не 5 хв.
      tolerations:
        - key: k2.arckos.net/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # PodSecurity "restricted": жодного контейнера від root. Користувач node (uid/gid 1000) з базового образу.
      # Застосунок не ходить в API Kubernetes — токен service account у под не монтується.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup — для томів, де kubelet змінює власника (RWO/emptyDir). На Longhorn RWX (NFS) kubelet
        # власника НЕ міняє (fsGroupPolicy драйвера — ReadWriteOnceWithFSType), тому корінь purchase-uploads-lh
        # уже віддано uid 1000 раніше (колишній initContainer fix-permissions від root, прибраний заради
        # restricted). Зараз корінь тому — 1000:1000, режим 0777. Для НОВОГО тому перевірити до викатки:
        #     kubectl -n ${NAMESPACE} exec deploy/purchase -- ls -lan /app/data/uploads
        # і, якщо uid 1000 не може писати, один раз віддати корінь uid 1000 (разовий под від root — до
        # enforce=restricted на namespace, бо restricted такий под не пустить).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: purchase-uploads-lh
        # Корінь образу — лише читання; тимчасові файли Node/бібліотек — сюди.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: purchase
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: purchase-config
            - secretRef:
                name: purchase-secret         # DATABASE_URL, KEYCLOAK_CLIENT_SECRET, SESSION_SECRET
          env:
            # Стеля V8-heap (~75 % від limits.memory), щоб Node не брав дефолт з розміру ноди.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
            - name: APP_VERSION
              value: "${IMAGE_TAG}"
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 3000
          # Порт починає слухати лише після підключення до БД і прогону міграцій. startup/liveness —
          # /api/health (процес живий, без БД), readiness — /api/health/ready (SELECT 1): без БД под
          # краще тримати поза Service. Проби не потребують входу, не пишуться в журнал і не трасуються.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Видалення з Endpoints і SIGTERM ідуть паралельно — пауза дає haproxy
                # побачити под вибулим, інакше кожен деплой роняє кілька запитів.
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# HA v2: під час drain / оновлення вузла лишається хоча б одна репліка (друга — на іншому вузлі).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  labels:
    app: purchase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: purchase
---
apiVersion: v1
kind: Service
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  labels:
    app: purchase
spec:
  type: ClusterIP
  selector:
    app: purchase
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: k2-intermediate-issuer
    # Завантаження файлів (до MAX_UPLOAD_MB) на повільному каналі не має рватися дефолтним таймаутом.
    haproxy.org/timeout-server: "300s"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - purchase.gov.kub.k2.lan
      secretName: purchase-tls-secret
  rules:
    - host: purchase.gov.kub.k2.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: purchase
                port:
                  name: http